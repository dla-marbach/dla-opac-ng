<f:comment>
  Creates a div.resultCount.

  It displays the current range and total number of results as appropriate.
  If an error occurred it indicates the error.
</f:comment>

  <f:if condition="{results.numfound}==0">
    <f:then>
      <f:if condition="{error}">
        <f:then>
          <f:translate key="Error" extensionName="dla_opac_ng"/>
        </f:then>
        <f:else>
          <f:translate key="no results" extensionName="dla_opac_ng"/>
        </f:else>
      </f:if>
    </f:then>
    <f:else>
      <f:if condition="{results.numfound}==1">
        <f:then>
          <f:translate key="1 result" extensionName="dla_opac_ng"/>
        </f:then>
        <f:else>
          <f:if condition="{results.numfound}<{config.counterEnd}">
            <f:then>
              {results.numfound} <f:translate key="results" extensionName="dla_opac_ng"/>
            </f:then>
            <f:else>
              <strong>
                <f:translate key="results" extensionName="dla_opac_ng"/>
                {config.counterStart}-{config.counterEnd}
              </strong>
              <f:translate key="of" extensionName="dla_opac_ng"/>
              {results.numfound}
            </f:else>
          </f:if>
    </f:else>
      </f:if>
    </f:else>
  </f:if>

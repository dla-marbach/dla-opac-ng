{namespace dla=Dla\DlaOpacNg\ViewHelpers}

<v:variable.set value="{s:data.valueForKey(array:document.fields, key:'digitalObject_accessLevel_mv')}" name="digitalObject_accessLevel_mv" />
<v:variable.set value="{s:data.valueForKey(array:document.fields, key:'digitalObject_hyperlink_mv')}" name="digitalObject_hyperlink_mv" />
<v:variable.set value="{s:data.valueForKey(array:document.fields, key:'digitalObject_thumbnail_mv')}" name="digitalObject_thumbnail_mv" />

<f:comment>
    Erstes Vorschaubild, auf das der Nutzer zugreifen darf (siehe MediaAccess/Thumbnail.html).
    Die Bildspalte wird nur gerendert, wenn es ein solches Vorschaubild gibt.
</f:comment>
<dla:mediaPlayer
    urls="{digitalObject_hyperlink_mv}"
    access="{digitalObject_accessLevel_mv}"
    thumbnails="{digitalObject_thumbnail_mv}"
    as="mediaData"
/>

<f:if condition="{mediaData.teaser}">
    <div class="ctg-ri-image">
        <f:link.action
            action="detail"
            arguments="{id:document.id}"
            section="{settings.jumpToID}"
            onclick="{f:if(
                condition:'{settings.paging.detailPagePaging} == 1',
                then:'return tx_find.detailViewWithPaging(this);'
                )}"
        >
            <img src="{mediaData.teaser.thumbnail}"/>
        </f:link.action>
    </div>
</f:if>

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Dla\DlaOpacNg\ViewHelpers\:
    resource: '../Classes/ViewHelpers/*'
    public: true

  Dla\DlaOpacNg\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Find/'
      # Natürlichsprachige Suche: Hilfsklassen mit Skalar-Parametern bzw. Wertobjekten werden von der
      # NaturalLanguageSearchMiddleware selbst erzeugt (inkl. Zwischenspeicher), nicht per Autowiring.
      - '../Classes/Service/QueryUnderstanding/'
      - '../Classes/Service/QueryUnderstandingService.php'

  # Klassen der ehemaligen Extension dla/find
  Dla\Find\:
    resource: '../Classes/Find/*'
    public: false

  Dla\Find\ViewHelpers\:
    resource: '../Classes/Find/ViewHelpers/*'
    public: true

  Dla\DlaOpacNg\Cli\Import:
    tags:
      - name: console.command
        command: 'dla_opac_ng:import'
        description: 'Import new collection hierarchy into database.'
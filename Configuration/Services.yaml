services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Dla\DlaOpacNg\ViewHelpers\:
    resource: '../Classes/ViewHelpers/*'
    public: true

  Dla\DlaOpacNg\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Find/'

  # Klassen der ehemaligen Extension dla/find
  Dla\Find\:
    resource: '../Classes/Find/*'
    public: false

  Dla\Find\ViewHelpers\:
    resource: '../Classes/Find/ViewHelpers/*'
    public: true

  Dla\DlaOpacNg\Cli\Import:
    tags:
      - name: console.command
        command: 'dla_opac_ng:import'
        description: 'Import new collection hierarchy into database.'

  Dla\DlaOpacNg\Cli\StatisticsAggregate:
    tags:
      - name: console.command
        command: 'dla_opac_ng:stats:aggregate'
        description: 'Aggregate raw catalogue usage statistics into daily and monthly JSON files.'

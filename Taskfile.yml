# https://taskfile.dev

version: '3'

tasks:
  install:
    desc: installiere und starte alle benötigten Komponenten
    cmds:
      - task: install_socat
      - task: install_ddev
      - task: install_ext

  install_socat:
    cmds:
      - sudo apt-get update || true
      - sudo apt-get install -y socat
      - |
        if lsof -iTCP:8983 -sTCP:LISTEN -Pn >/dev/null 2>&1; then
          echo "socat läuft bereits auf Port 8983"
        else
          bash -c 'nohup socat TCP-LISTEN:8983,fork,bind=0.0.0.0,reuseaddr TCP:127.0.0.1:18983 >/tmp/socat-8983.log 2>&1 &'
          echo "socat wurde im Hintergrund gestartet (Log: /tmp/socat-8983.log)"
        fi

  install_ddev:
    dir: t3example
    cmds:
      - |
        ddev config --project-type typo3 \
        --docroot public \
        --php-version 8.2 \
        --database=mariadb:10.11
      - cp ../.devfiles/.env .ddev/.env
      - ddev start -y
      - ddev composer create-project "typo3/cms-base-distribution:^12" --no-security-blocking
      - |
        ddev typo3 setup \
        --no-interaction \
        --server-type=other \
        --driver=mysqli \
        --host=db \
        --port=3306 \
        --dbname=db \
        --username=db \
        --password=db \
        --admin-username=admin \
        --admin-user-password="Dla1337!" \
        --admin-email="info@example.com" \
        --project-name="DLA OPAC" \
        --force
      - ddev composer require fluidtypo3/flux
      - ddev import-db < ../.devfiles/init.sql
      - cp ../.devfiles/additional.php config/system/additional.php
      - cp ../.devfiles/robots.txt public/robots.txt
      - mkdir -p config/sites/dla-opac && cp ../.devfiles/siteconfig.yaml config/sites/dla-opac/config.yaml

  install_ext:
    dir: t3example
    cmds:
      - mkdir -p .local-ext
      - rm -rf .local-ext/dla-dla_opac_ng
      - mkdir -p .local-ext/dla-dla_opac_ng
      - |
        cp -al \
        ../Classes \
        ../Configuration \
        ../Resources \
        ../Tests \
        ../LICENSE \
        ../composer.json \
        ../ext_* \
        .local-ext/dla-dla_opac_ng/
      - rm -rf packages/dla-dla_opac_ng
      - ln -s ../.local-ext/dla-dla_opac_ng packages/dla-dla_opac_ng
      - |
        mkdir -p packages/dla-dla_opac_ng/Resources/Public/Fonts
        cp -al ../.devfiles/*.woff2 packages/dla-dla_opac_ng/Resources/Public/Fonts
      - |
        mkdir -p packages/dla-dla_opac_ng/Resources/Public/CSS
        cp -al ../.devfiles/site.min.css packages/dla-dla_opac_ng/Resources/Public/CSS/
      - ddev composer require "dla/dla_opac_ng:@dev"
      - ddev composer require --dev "typo3/testing-framework:^8.3"
      - php ../.devfiles/add-test-autoload.php
      - ddev exec composer dump-autoload
      - cp -f ../.devfiles/systematik.tsv systematik.tsv
      - cp -f ../.devfiles/tektonik.tsv tektonik.tsv
      - ddev exec vendor/bin/typo3 dla_opac_ng:import -t classification -f systematik.tsv -p 6
      - ddev exec vendor/bin/typo3 dla_opac_ng:import -t collection -f tektonik.tsv -p 6

  llm:
    desc: lokalen LLM-Dienst (Ollama in Docker) für die natürlichsprachige Suche starten und Modell laden
    vars:
      MODEL: '{{default "qwen3:4b-instruct-2507-q4_K_M" .MODEL}}'
    cmds:
      - |
        if docker container inspect ollama >/dev/null 2>&1; then
          docker start ollama >/dev/null
        else
          docker run -d --name ollama --restart unless-stopped \
            -p 127.0.0.1:11434:11434 \
            -v ollama:/root/.ollama \
            -e OLLAMA_KEEP_ALIVE=24h \
            -e OLLAMA_NUM_PARALLEL=2 \
            -e OLLAMA_MAX_QUEUE=4 \
            -e OLLAMA_CONTEXT_LENGTH=8192 \
            ollama/ollama
        fi
      - |
        for i in $(seq 1 60); do
          curl -sf http://127.0.0.1:11434/api/version >/dev/null && break
          sleep 1
        done
        curl -sf http://127.0.0.1:11434/api/version
      # Der Port ist nur auf 127.0.0.1 des Hosts freigegeben und deshalb über host.docker.internal nicht erreichbar.
      # Der Web-Container von DDEV erreicht Ollama stattdessen über das gemeinsame Docker-Netzwerk ddev_default.
      - |
        if docker network inspect ddev_default >/dev/null 2>&1; then
          docker network connect ddev_default ollama 2>/dev/null || true
          echo "Ollama ist für DDEV unter http://ollama:11434 erreichbar."
        else
          echo "Netzwerk ddev_default fehlt: erst DDEV starten (cd t3example && ddev start), dann 'task llm' wiederholen."
        fi
      - docker exec ollama ollama pull {{.MODEL}}
      - echo "LLM-Dienst läuft. Test mit 'task llm:test', dann im Katalog 'Als Frage verstehen' ausprobieren."

  llm:test:
    desc: natürlichsprachige Suche gegen den lokalen LLM-Dienst testen (strukturierte JSON-Ausgabe)
    vars:
      MODEL: '{{default "qwen3:4b-instruct-2507-q4_K_M" .MODEL}}'
      QUESTION: '{{default "Briefe von Hesse an Thomas Mann aus den 1930er Jahren über das Exil" .QUESTION}}'
    env:
      MODEL: '{{.MODEL}}'
      QUESTION: '{{.QUESTION}}'
    cmds:
      # Anfrage wie im Katalog (Systemprompt mit aktuellem Jahr, Beispiele, JSON-Schema), aber ohne Vokabular aus Solr
      - |
        php -r '
          spl_autoload_register(static function (string $class): void {
            $prefix = "Dla\\DlaOpacNg\\";
            if (str_starts_with($class, $prefix)) {
              require getcwd() . "/Classes/" . str_replace("\\", "/", substr($class, strlen($prefix))) . ".php";
            }
          });
          $prompt = new \Dla\DlaOpacNg\Service\QueryUnderstanding\QueryPrompt();
          echo json_encode([
            "model" => getenv("MODEL"),
            "temperature" => 0,
            "messages" => $prompt->buildMessages(getenv("QUESTION")),
            "response_format" => ["type" => "json_schema", "json_schema" => [
              "name" => "catalog_query", "strict" => true, "schema" => $prompt::getJsonSchema(),
            ]],
          ], JSON_UNESCAPED_UNICODE);
        ' \
        | curl -sS http://127.0.0.1:11434/v1/chat/completions -H 'Content-Type: application/json' -d @- \
        | jq '(.choices[0].message.content | fromjson), {usage}'
    preconditions:
      - command -v jq
      - command -v php

  llm:stop:
    desc: lokalen LLM-Dienst stoppen
    cmds:
      - docker stop ollama

  cache:
    dir: t3example
    desc: lösche den TYPO3-Cache, um Code-Änderungen wirksam zu machen
    cmds:
      - rm -rf packages/dla-dla_opac_ng
      - task: install_ext
      - ddev typo3 cache:flush
      - ddev exec composer dump-autoload

  reinstall:
    desc: löschen, neuinstallieren und starten
    cmds:
      - task: delete
      - task: install

  delete:
    desc: lösche die gesamten DDEV Container
    dir: t3example
    cmds:
      - ddev poweroff
      - ddev delete -y --omit-snapshot || true
      - cd .. && rm -rf t3example

  test:php:
    desc: PHPUnit-Tests mit Solr-Mockdaten ausführen, kein Solr-Tunnel nötig
    dir: t3example
    cmds:
      - ddev exec vendor/bin/phpunit -c packages/dla-dla_opac_ng/Tests/phpunit.xml

  test:php:record:
    desc: PHPUnit-Tests (dla_opac_ng) gegen den echten Solr ausführen und fehlende Solr-Cassetten aufzeichnen (Solr-Tunnel nötig)
    cmds:
      - rsync -a Tests/ t3example/.local-ext/dla-dla_opac_ng/Tests/
      - cd t3example && ddev exec 'SOLR_RECORD_BASE=http://host.docker.internal:8983 vendor/bin/phpunit -c packages/dla-dla_opac_ng/Tests/phpunit.xml'
      - mkdir -p Tests/Fixtures/Solr/cassettes/subqueries
      - rsync -a --ignore-existing t3example/.local-ext/dla-dla_opac_ng/Tests/Fixtures/Solr/cassettes/subqueries/ Tests/Fixtures/Solr/cassettes/subqueries/

  test:
    desc: Playwright-Test ausführen
    dir: dla-opac-tests
    cmds:
      - npx playwright test {{.CLI_ARGS}}
    env:
      BASE_URL: http://127.0.0.1/

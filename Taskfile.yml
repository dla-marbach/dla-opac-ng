# https://taskfile.dev

version: '3'

vars:
  PHP_VERSION: '8.3'
  MARIADB_VERSION: '11.8'
  # PHP in der Version des Produktivsystems, auch wenn eine andere Version zuerst im PATH liegt (z.B. im Codespace)
  PHP:
    sh: command -v php{{.PHP_VERSION}} || command -v php || echo php
  COMPOSER: '{{.PHP}} $(command -v composer)'
  # Solr-Tunnel (echter Solr) und Solr-Mock-Server (SOLR_HOST der TYPO3-Instanz, siehe .devfiles/.env)
  SOLR_PORT: '8983'
  SOLR_MOCK_PORT: '8984'

env:
  COMPOSER_NO_SECURITY_BLOCKING: '1'

tasks:
  install:
    desc: installiere und starte alle benötigten Komponenten
    cmds:
      - task: install_packages
      # neuer Task-Prozess, damit das eben installierte PHP {{.PHP_VERSION}} verwendet wird
      - '{{.TASK_EXE}} install_typo3'

  install_packages:
    desc: installiere PHP, Composer, Apache und MariaDB per apt, falls noch nicht vorhanden
    cmds:
      - |
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        PACKAGES=""
        # PHP-Erweiterungen auch dann prüfen, wenn PHP schon vorhanden ist (CLI und FPM nutzen dieselben Pakete)
        for PACKAGE in unzip apache2 $(printf 'php{{.PHP_VERSION}}-%s ' cli fpm curl gd intl mbstring mysql xml zip); do
          dpkg -s "$PACKAGE" >/dev/null 2>&1 || PACKAGES="$PACKAGES $PACKAGE"
        done
        command -v composer >/dev/null || PACKAGES="$PACKAGES composer"
        command -v mariadb >/dev/null || command -v mysql >/dev/null || PACKAGES="$PACKAGES mariadb-client"
        # MariaDB-Server nur installieren, wenn keine Datenbank läuft (z.B. Service-Container in der Copilot-Umgebung)
        if ! bash -c '</dev/tcp/127.0.0.1/3306' 2>/dev/null && ! command -v mariadbd >/dev/null; then
          PACKAGES="$PACKAGES mariadb-server mariadb-client"
          # Version wie im Produktivsystem aus dem MariaDB-Repository, sonst die Version der Distribution
          if curl -fsSL -m 20 -o /tmp/mariadb_repo_setup https://r.mariadb.com/downloads/mariadb_repo_setup; then
            $SUDO bash /tmp/mariadb_repo_setup --mariadb-server-version="mariadb-{{.MARIADB_VERSION}}" --skip-maxscale --skip-tools \
              || echo "MariaDB-Repository nicht verfügbar, verwende MariaDB der Distribution"
          else
            echo "MariaDB-Repository nicht erreichbar, verwende MariaDB der Distribution"
          fi
        fi
        if [ -n "$PACKAGES" ]; then
          $SUDO apt-get update || true
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PACKAGES
        fi
        php{{.PHP_VERSION}} -r 'foreach (["curl", "intl", "mbstring", "mysqli", "pdo_mysql", "xml", "zip"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "PHP-Erweiterung fehlt: $e\n"); exit(1); } }'

  install_typo3:
    cmds:
      - task: db:start
      - '{{.COMPOSER}} create-project "typo3/cms-base-distribution:^12" t3example --no-interaction --no-progress'
      - task: install_typo3_config
      - task: install_ext
      - task: start
      # Markierung für eine vollständige Installation (siehe .claude/hooks/session-start.sh)
      - touch t3example/.installed

  install_typo3_config:
    dir: t3example
    dotenv: ['../.devfiles/.env']
    cmds:
      - |
        {{.PHP}} vendor/bin/typo3 setup \
        --no-interaction \
        --server-type=apache \
        --driver=mysqli \
        --host=127.0.0.1 \
        --port=3306 \
        --dbname=db \
        --username=db \
        --password=db \
        --admin-username=admin \
        --admin-user-password="Dla1337!" \
        --admin-email="info@example.com" \
        --project-name="DLA OPAC" \
        --force
      - '{{.COMPOSER}} require fluidtypo3/flux --no-interaction --no-progress'
      - $(command -v mariadb || command -v mysql) -h127.0.0.1 -udb -pdb db < ../.devfiles/init.sql
      - cp ../.devfiles/additional.php config/system/additional.php
      - cp ../.devfiles/robots.txt public/robots.txt
      - mkdir -p config/sites/dla-opac && cp ../.devfiles/siteconfig.yaml config/sites/dla-opac/config.yaml

  install_ext:
    dir: t3example
    dotenv: ['../.devfiles/.env']
    cmds:
      - task: link_ext
      - '{{.COMPOSER}} require "dla/dla_opac_ng:@dev" --no-interaction --no-progress'
      - cp -f ../.devfiles/systematik.tsv systematik.tsv
      - cp -f ../.devfiles/tektonik.tsv tektonik.tsv
      - '{{.PHP}} vendor/bin/typo3 dla_opac_ng:import -t classification -f systematik.tsv -p 6'
      - '{{.PHP}} vendor/bin/typo3 dla_opac_ng:import -t collection -f tektonik.tsv -p 6'

  link_ext:
    dir: t3example
    cmds:
      # Composer-Path-Repository (packages/*): die Extension ist das Repository selbst, Änderungen wirken sofort
      - mkdir -p packages
      - rm -rf packages/dla-dla_opac_ng
      - ln -s ../.. packages/dla-dla_opac_ng
      # Schriften liegen nur für die Entwicklungsumgebung in .devfiles/ (Resources/Public/Fonts/ ist in .gitignore)
      - |
        mkdir -p ../Resources/Public/Fonts
        for FONT in ../.devfiles/*.woff2; do
          ln -sf "../../../.devfiles/$(basename "$FONT")" ../Resources/Public/Fonts/
        done

  start:
    desc: starte MariaDB, Solr-Mock-Server, PHP-FPM und Apache (z.B. nach einem Neustart des Codespaces)
    cmds:
      - task: db:start
      - task: solr:start
      - task: web:start

  stop:
    desc: stoppe Apache, PHP-FPM und Solr-Mock-Server (MariaDB läuft weiter)
    cmds:
      - task: web:stop
      - task: solr:stop

  db:start:
    desc: starte MariaDB (falls nötig) und lege Datenbank und Benutzer an
    cmds:
      - |
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        if bash -c '</dev/tcp/127.0.0.1/3306' 2>/dev/null; then
          echo "MariaDB läuft bereits"
        else
          $SUDO service mariadb start
        fi
        MYSQL=$(command -v mariadb || command -v mysql)
        if ! $MYSQL -h127.0.0.1 -udb -pdb db -e 'SELECT 1' >/dev/null 2>&1; then
          $SUDO $MYSQL -e "CREATE DATABASE IF NOT EXISTS db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS 'db'@'localhost' IDENTIFIED BY 'db';
            CREATE USER IF NOT EXISTS 'db'@'%' IDENTIFIED BY 'db';
            GRANT ALL ON db.* TO 'db'@'localhost';
            GRANT ALL ON db.* TO 'db'@'%';"
        fi

  db:export:
    desc: exportiere die Datenbank nach .devfiles/init.sql
    cmds:
      - $(command -v mariadb-dump || command -v mysqldump) -h127.0.0.1 -udb -pdb db > .devfiles/init.sql

  web:start:
    desc: konfiguriere und starte PHP-FPM und Apache (Port 80) für die TYPO3-Instanz
    dir: t3example
    cmds:
      - |
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        # PHP-FPM läuft unter dem Benutzer, dem t3example/ gehört, Apache ebenso (außer bei root)
        OWNER=$(stat -c %U .)
        OWNER_GROUP=$(stat -c %G .)
        if [ "$OWNER" = root ]; then WEB_USER=www-data; WEB_GROUP=www-data; else WEB_USER=$OWNER; WEB_GROUP=$OWNER_GROUP; fi
        {
          printf '[global]\npid = /run/php/typo3-php-fpm.pid\nerror_log = /tmp/typo3-php-fpm.log\n\n'
          sed -e "s#@USER@#$OWNER#; s#@GROUP@#$OWNER_GROUP#; s#^listen.owner = .*#listen.owner = $WEB_USER#; s#^listen.group = .*#listen.group = $WEB_GROUP#" \
            ../.devfiles/php-fpm.conf
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' ../.devfiles/.env | sed -E 's/^([^=]+)=(.*)$/env[\1] = \2/'
        } | $SUDO tee /etc/php/{{.PHP_VERSION}}/fpm/typo3-php-fpm.conf >/dev/null
        {
          printf 'ServerName localhost\nUser %s\nGroup %s\n\n' "$WEB_USER" "$WEB_GROUP"
          sed -e "s#@T3ROOT@#$PWD#g" ../.devfiles/apache.conf
        } | $SUDO tee /etc/apache2/sites-available/typo3.conf >/dev/null
        $SUDO a2enmod -q rewrite headers expires deflate proxy_fcgi setenvif >/dev/null
        $SUDO a2dissite -q 000-default >/dev/null 2>&1 || true
        $SUDO a2ensite -q typo3 >/dev/null
        $SUDO mkdir -p /run/php
        PIDFILE=/run/php/typo3-php-fpm.pid
        if [ -f $PIDFILE ] && $SUDO /bin/kill -0 "$(cat $PIDFILE)" 2>/dev/null; then
          $SUDO /bin/kill -USR2 "$(cat $PIDFILE)"
        else
          $SUDO /usr/sbin/php-fpm{{.PHP_VERSION}} --allow-to-run-as-root --fpm-config /etc/php/{{.PHP_VERSION}}/fpm/typo3-php-fpm.conf
        fi
        $SUDO /usr/sbin/apachectl graceful
        echo "TYPO3 läuft auf http://127.0.0.1/ (Logs: /tmp/typo3-apache-error.log, /tmp/typo3-php-error.log, var/log/)"

  web:stop:
    cmds:
      - |
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        $SUDO /usr/sbin/apachectl stop 2>/dev/null || true
        [ ! -f /run/php/typo3-php-fpm.pid ] || $SUDO /bin/kill "$(cat /run/php/typo3-php-fpm.pid)" 2>/dev/null || true

  solr:start:
    desc: starte den Solr-Mock-Server für die TYPO3-Instanz (reicht an den echten Solr durch, solange der Tunnel auf Port 8983 besteht)
    vars:
      MODE: '{{.MODE | default "proxy"}}'
    cmds:
      - |
        if bash -c '</dev/tcp/127.0.0.1/{{.SOLR_MOCK_PORT}}' 2>/dev/null; then
          echo "Solr-Mock-Server läuft bereits auf Port {{.SOLR_MOCK_PORT}}"
          exit 0
        fi
        {{if eq .MODE "record"}}
        export SOLR_RECORD_BASE=http://127.0.0.1:{{.SOLR_PORT}}
        {{else}}
        export SOLR_PROXY_BASE=http://127.0.0.1:{{.SOLR_PORT}}
        {{end}}
        export SOLR_RECORD_DIR=typo3 PHP_CLI_SERVER_WORKERS=4
        # über bash starten, damit der Server nach dem Ende von task weiterläuft
        bash -c 'setsid nohup "$0" -S 127.0.0.1:{{.SOLR_MOCK_PORT}} -t Tests/Fixtures/Solr Tests/Fixtures/Solr/MockSolrServer.php \
          > /tmp/solr-mock.log 2>&1 < /dev/null &' {{.PHP}}
        for i in $(seq 20); do
          bash -c '</dev/tcp/127.0.0.1/{{.SOLR_MOCK_PORT}}' 2>/dev/null && break
          [ "$i" -lt 20 ] || { echo "Solr-Mock-Server startet nicht:"; cat /tmp/solr-mock.log; exit 1; }
          sleep 0.25
        done
        echo "Solr-Mock-Server ({{.MODE}}) läuft auf Port {{.SOLR_MOCK_PORT}} (Log: /tmp/solr-mock.log)"

  solr:record:
    desc: starte den Solr-Mock-Server im Aufnahmemodus (fehlende Antworten vom Tunnel auf Port 8983 als Cassetten speichern)
    cmds:
      - task: solr:stop
      - task: solr:start
        vars:
          MODE: record

  solr:stop:
    cmds:
      - pkill -f "^[^ ]*php[^ ]* -S 127.0.0.1:{{.SOLR_MOCK_PORT}} " || true

  cache:
    desc: lösche den TYPO3-Cache (z.B. nach Änderungen an TypoScript, Services.yaml oder ext_localconf.php)
    dir: t3example
    dotenv: ['../.devfiles/.env']
    cmds:
      - task: link_ext
      - '{{.PHP}} vendor/bin/typo3 cache:flush'
      - '{{.COMPOSER}} dump-autoload'

  reinstall:
    desc: löschen, neuinstallieren und starten
    cmds:
      # zuerst, damit delete auch in einer frischen Umgebung MariaDB starten kann
      - task: install_packages
      - task: delete
      - task: install

  delete:
    desc: lösche die TYPO3-Instanz und leere die Datenbank
    cmds:
      - task: stop
      - task: db:start
      - |
        $(command -v mariadb || command -v mysql) -h127.0.0.1 -udb -pdb \
          -e "DROP DATABASE IF EXISTS db; CREATE DATABASE db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - rm -rf t3example

  test:php:install:
    desc: Composer-Abhängigkeiten für die PHPUnit-Tests im Repository installieren
    cmds:
      - '{{.COMPOSER}} install --no-interaction --no-progress'

  test:php:
    desc: PHPUnit-Tests mit Solr-Mockdaten ausführen (ohne TYPO3-Instanz, wie in der CI), kein Solr-Tunnel nötig
    cmds:
      - task: test:php:install
      - '{{.PHP}} vendor/bin/phpunit -c Tests/phpunit.xml {{.CLI_ARGS}}'

  test:php:record:
    desc: PHPUnit-Tests gegen den echten Solr ausführen und fehlende Solr-Cassetten aufzeichnen (Solr-Tunnel nötig)
    cmds:
      - task: test:php:install
      - 'SOLR_RECORD_BASE=http://127.0.0.1:{{.SOLR_PORT}} {{.PHP}} vendor/bin/phpunit -c Tests/phpunit.xml {{.CLI_ARGS}}'

  test:
    desc: Playwright-Test ausführen
    dir: dla-opac-tests
    cmds:
      - npx playwright test {{.CLI_ARGS}}
    env:
      BASE_URL: http://127.0.0.1/

; PHP-FPM-Pool der lokalen TYPO3-Instanz (task start). Läuft unter dem Benutzer, dem t3example/ gehört,
; damit Webserver und TYPO3-CLI dieselben Dateien schreiben können. Umgebungsvariablen aus .devfiles/.env
; werden von task start angehängt.
[typo3]
user = @USER@
group = @GROUP@
listen = /run/php/typo3-php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
php_admin_value[error_log] = /tmp/typo3-php-error.log
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 240
php_admin_value[max_input_vars] = 1500

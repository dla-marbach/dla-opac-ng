# Apache-Konfiguration der lokalen TYPO3-Instanz (task start), @T3ROOT@ wird durch t3example/ ersetzt
<VirtualHost *:80>
    DocumentRoot @T3ROOT@/public
    DirectoryIndex index.php index.html

    <Directory @T3ROOT@>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/typo3-php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /tmp/typo3-apache-error.log
    CustomLog /tmp/typo3-apache-access.log combined
</VirtualHost>

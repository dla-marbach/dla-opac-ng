name: PHP Tests (PHPUnit)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit tests (${{ matrix.dependency-versions }} dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Ohne composer.lock (Extension) gegen beide Enden der Constraints in composer.json testen:
    # highest = neueste passende Versionen (wie bei einem Update im Projekt),
    # lowest = niedrigste erlaubte Versionen (prüft die Untergrenzen, z.B. typo3/cms-core ^12.4.9)
    strategy:
      fail-fast: false
      matrix:
        dependency-versions: [highest, lowest]

    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@v4

      # Die Unit-Tests brauchen weder TYPO3-Instanz noch Datenbank oder Solr (Solr-Mock-Server, siehe README),
      # daher direkt mit PHP auf dem Runner. PHP-Version wie im Produktivsystem.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies (mit Composer-Cache)
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit -c Tests/phpunit.xml

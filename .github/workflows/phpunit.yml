name: PHP Tests (PHPUnit)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit tests (TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # alle unterstützten TYPO3-Versionen
        typo3: ['^12.4', '^13.4', '^14.3']

    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@v4

      # Die Unit-Tests brauchen weder TYPO3-Instanz noch Datenbank oder Solr (Solr-Mock-Server, siehe README),
      # daher direkt mit PHP auf dem Runner. PHP-Version wie im Produktivsystem.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # composer.lock ist nicht versioniert: "highest" führt composer update aus, --with legt die TYPO3-Version fest
      - name: Install dependencies (mit Composer-Cache)
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --with typo3/cms-core:${{ matrix.typo3 }}
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit -c Tests/phpunit.xml

name: PHP Tests (PHPUnit)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@v4

      # Die Unit-Tests brauchen weder DDEV noch Datenbank oder Solr (Solr-Mock-Server, siehe README),
      # daher direkt mit PHP auf dem Runner. PHP-Version wie in der DDEV-Umgebung (Taskfile.yml).
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies (mit Composer-Cache)
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit -c Tests/phpunit.xml

name: PHP Tests (PHPUnit)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@v4

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          # Authentifizierte Anfrage vermeidet das GitHub-API-Rate-Limit beim Ermitteln der Task-Version
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install test environment
        run: task install

      - name: Run PHPUnit tests
        run: task test:php

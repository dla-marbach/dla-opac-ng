name: "Copilot Setup Steps"

# Prepares the environment for the Copilot cloud agent before its firewall is active.
# Runs automatically for the agent; triggers here are only for manual/PR validation.
# Installs Task and PHP with the Composer dependencies of this repository, sets up and starts a TYPO3 instance
# (`task install`: MariaDB service container, Apache with PHP-FPM on port 80, Solr mock server) and pulls the
# Psalm image, checks out the Playwright submodule and installs Playwright with Chromium, so that the agent can run
# `task test:php`, `task test`, Psalm (docker) and requests against http://127.0.0.1/
# without further network access.
# Note: only steps, permissions, runs-on, services, snapshot and timeout-minutes of the
# job are honored by Copilot (e.g. job-level env is ignored, so set env per step).
# A failing step skips all following steps, so keep verification out of this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    # Gleiche MariaDB-Version wie im Produktivsystem; task install erkennt die laufende Datenbank
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Submodul dla-opac-tests (Playwright-End-to-End-Tests)
          submodules: true

      - name: Set up Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          # Authentifizierte Anfrage vermeidet das GitHub-API-Rate-Limit beim Ermitteln der Task-Version
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # PHP-Version wie im Produktivsystem; setup-php hinterlegt das GITHUB_TOKEN auch für Composer,
      # PHP-FPM und Apache installiert task install per apt
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, mysqli, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies for PHPUnit
        run: task test:php:install

      - name: Install test environment
        run: task install

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Playwright-Abhängigkeiten und Chromium, damit `task test` ohne Netzwerkzugriff läuft
      - name: Install Playwright
        working-directory: dla-opac-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Same image/version as .github/workflows/psalm.yml; allows running Psalm offline
      - name: Pull Psalm image
        run: docker pull ghcr.io/psalm/psalm-github-actions:6.16.1

name: "Copilot Setup Steps"

# Prepares the environment for the Copilot cloud agent before its firewall is active.
# Runs automatically for the agent; triggers here are only for manual/PR validation.
# Installs DDEV/Task, PHP with the Composer dependencies of this repository, pulls Docker images
# and runs `task install`, so that the agent can run `task test:php` and Psalm (docker)
# without further network access.
# Note: only steps, permissions, runs-on, services, snapshot and timeout-minutes of the
# job are honored by Copilot (e.g. job-level env is ignored, so set env per step).
# A failing step skips all following steps, so keep verification out of this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout dla-opac-ng
        uses: actions/checkout@v4

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          # Authentifizierte Anfrage vermeidet das GitHub-API-Rate-Limit beim Ermitteln der Task-Version
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # PHP + Composer-Abhängigkeiten im Repository, damit der Agent die PHPUnit-Tests ohne DDEV
      # ausführen kann (task test:php)
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: composer install --no-interaction --no-progress

      - name: Configure Composer GitHub token (avoids api.github.com auth failures)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ddev/homeadditions/.composer
          printf '{"github-oauth":{"github.com":"%s"}}' "$GITHUB_TOKEN" > ~/.ddev/homeadditions/.composer/auth.json
          chmod 600 ~/.ddev/homeadditions/.composer/auth.json

      - name: Install test environment
        run: task install

      # Same image/version as .github/workflows/psalm.yml; allows running Psalm offline
      - name: Pull Psalm image
        run: docker pull ghcr.io/psalm/psalm-github-actions:6.16.1

